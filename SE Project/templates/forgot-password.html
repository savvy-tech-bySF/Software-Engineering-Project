<!-- forgot-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CodeQuest – Forgot Password</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-container">
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

  <div class="card">
    <!-- Code Icon -->
    <div class="code-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
    </div>

    <!-- Heading -->
    <div class="header">
      <h1>Forgot Password</h1>
      <p>Enter email address to receive OTP<br/>Verification Code</p>
    </div>

    <!-- OTP Form -->
    <form id="otpForm" class="form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <button type="submit" class="btn-primary">Get OTP</button>
    </form>

    <!-- Divider -->
    <div class="divider"><span>Or continue with</span></div>

    <!-- OAuth Buttons -->
    <div class="oauth-container">
      <button onclick="oauth('GitHub')" class="btn-oauth">
        <img src="assets/github.svg" alt="GitHub" class="icon"> GitHub
      </button>
      <button onclick="oauth('GitLab')" class="btn-oauth">
        <img src="assets/gitlab.svg" alt="GitLab" class="icon"> GitLab
      </button>
    </div>
  </div>

  <script>
    // OTP form handler
    document.getElementById('otpForm').addEventListener('submit', e => {
      e.preventDefault();
      const email = e.target.email.value;
      console.log('Requesting OTP for:', email);
      // TODO: call your backend to send OTP
      alert(`An OTP has been sent to ${email}`);
      // Redirect to OTP verification page:
      window.location.href = 'forgot-password-verify.html';
    });

    // Reuse your existing oauth() from auth.js
    function oauth(provider) {
      alert(`OAuth with ${provider} (not yet implemented)`);
    }
  </script>
</body>
</html>
